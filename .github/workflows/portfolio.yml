name: Portfolio freshness
on:
  push:
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**', 'demos/**', 'portfolio/**', 'scripts/**', 'tests/portfolio-check.test.mjs', '.github/workflows/portfolio.yml']
  pull_request:
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**', 'demos/**', 'portfolio/**', 'scripts/**', 'tests/portfolio-check.test.mjs', '.github/workflows/portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/portfolio-check.test.mjs
      - run: node scripts/portfolio-check.mjs
